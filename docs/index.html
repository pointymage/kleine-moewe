<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c3644">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head><body>
<title>Kleine Möwe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen harbour merge game — resource bar, order strip, 7×9 merge board on a wooden tray, info shelf, tab bar */
:root{
  --sea-deep:#0c3644; --sea:#1b6a7f; --foam:#e4f2ef; --tile:#fff7e8; --tile-alt:#f5e8cc;
  --plank:#c18a52; --plank-dark:#764c26; --coral:#ff5470; --gold:#f0ad2c; --ink:#1c2a33; --muted:#5f6d74; --leaf:#2f9a5e;
  --f-ui:"Fredoka","Trebuchet MS",system-ui,sans-serif; --f-title:"Yeseva One",Georgia,serif;
  --t:48px;
  color-scheme:light;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--sea-deep);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:540px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;padding-inline:16px;
  background:radial-gradient(120% 60% at 50% 0%,#24788d 0%,var(--sea-deep) 70%)}

/* top bar */
.top{display:flex;align-items:center;gap:6px;padding-block:10px 8px}
.pill{display:flex;align-items:center;gap:4px;height:32px;padding:0 9px;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill span{font-size:15px}
.pill.en{position:relative}
.pill.en small{font-size:10px;font-weight:500;opacity:.8;min-width:0}
.pill.en em{font-style:normal;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--leaf);font-size:14px;line-height:1}
.pill.lvl{gap:6px;padding-left:4px}
.pill.lvl b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:14px}
.pill.lvl .bar{width:34px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.pill.lvl .bar i{display:block;height:100%;background:var(--gold);width:0}
.top .sp{flex:1}
.icon{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:17px}

main{position:relative;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
.view[hidden]{display:none!important}

/* orders */
.orders{display:flex;gap:8px}
.ord{flex:1 1 0;min-width:0;background:var(--tile);border-radius:14px;padding:7px 7px 8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.18);animation:in .35s ease-out}
.ord.ready{box-shadow:0 0 0 3px var(--leaf),0 3px 0 rgba(0,0,0,.18)}
.cu{display:flex;align-items:center;gap:5px;min-width:0}
.av{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--tile-alt);font-size:16px}
.cn{font-size:11.5px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reqs{display:flex;gap:4px;justify-content:center}
.rq{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--tile-alt);font-size:24px}
.rq.have::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;background:var(--leaf);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.rw{font-size:11px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.go{height:26px;border-radius:13px;background:var(--leaf);color:#fff;font-weight:600;font-size:13px}
.go:disabled{background:#d9cfbd;color:#8c8273;cursor:default}

.hint{background:#fff;color:var(--ink);border-radius:12px;padding:7px 11px;font-size:13px;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.18)}

/* board */
.boardwrap{flex:1;min-height:0;display:grid;place-items:center}
.board{display:grid;grid-template-columns:repeat(7,var(--t));grid-auto-rows:var(--t);padding:6px;border-radius:16px;
  background:var(--plank);box-shadow:inset 0 0 0 3px var(--plank-dark),0 6px 0 var(--plank-dark);touch-action:none}
.cell{position:relative;display:grid;place-items:center;font-size:calc(var(--t)*.6);line-height:1;background:var(--tile)}
.cell.alt{background:var(--tile-alt)}
.cell:nth-child(1){border-top-left-radius:10px}.cell:nth-child(7){border-top-right-radius:10px}
.cell:nth-child(57){border-bottom-left-radius:10px}.cell:nth-child(63){border-bottom-right-radius:10px}
.cell .e{display:block;transition:transform .12s}
.cell .lv{position:absolute;right:2px;bottom:1px;font-size:calc(var(--t)*.22);font-weight:700;color:var(--plank-dark);font-family:var(--f-ui)}
.cell .ok{position:absolute;left:2px;top:2px;width:calc(var(--t)*.3);height:calc(var(--t)*.3);border-radius:50%;background:var(--leaf);color:#fff;font-size:calc(var(--t)*.2);font-weight:700;display:grid;place-items:center;font-style:normal}
.cell.gen .e{filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.cell.gen::before{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,#ffe7a6 0%,rgba(255,231,166,0) 70%)}
.cell.gen .e{position:relative}
.cell.web .e{opacity:.55;filter:saturate(.6)}
.cell.web::after{content:"";position:absolute;inset:3px;border-radius:8px;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(120,120,130,.35) 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,rgba(120,120,130,.35) 0 1px,transparent 1px 7px)}
.cell.box{background:#a87545}
.cell.box.alt{background:#9c6b3d}
.cell.box .q{width:72%;height:72%;border-radius:6px;display:grid;place-items:center;font-size:calc(var(--t)*.34);font-weight:700;color:#f3dcb8;
  background:linear-gradient(45deg,transparent 46%,rgba(80,48,20,.45) 46% 54%,transparent 54%),#8a5a2e;box-shadow:inset 0 0 0 2px #6b431f}
.cell.sel{box-shadow:inset 0 0 0 3px var(--coral);z-index:1;border-radius:8px}
.cell.lift .e{opacity:.25}
.cell.pop .e{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
.cell.pulse .e{animation:pulse 1.1s ease-in-out infinite}
.cell.drop{box-shadow:inset 0 0 0 3px var(--gold)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
@keyframes in{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;font-size:calc(var(--t)*.8);line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}

/* shelf */
.shelf{height:68px;flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.92);margin-bottom:6px}
.shelf .big{flex:none;width:46px;height:46px;border-radius:12px;background:var(--tile-alt);display:grid;place-items:center;font-size:30px}
.shelf .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.shelf .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain{display:flex;gap:1px;font-size:14px}
.chain span{opacity:.35}.chain span.on{opacity:1}.chain span.past{opacity:.7}
.shelf .acts{display:flex;gap:6px;flex:none}
.btn{height:34px;padding:0 12px;border-radius:17px;background:var(--sea);color:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.btn.alt{background:var(--tile-alt);color:var(--ink)}
.btn.warn{background:var(--coral)}
.btn:disabled{background:#d9cfbd;color:#8c8273;cursor:default}
.shelf .empty{color:var(--muted);font-size:13px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:6px 10px}
.tabs button{position:relative;height:46px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tabs button span.i{font-size:18px;line-height:1}
.tabs button.on{background:#fff;color:var(--ink)}
.tabs .dot{position:absolute;top:5px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}
.tabs button.pulse{animation:pulse 1.1s ease-in-out infinite}

/* café */
#vCafe{overflow-y:auto;padding-bottom:8px}
.scene{position:relative;flex:none;width:min(100%,calc(46vh * 1.333));aspect-ratio:4/3;margin-inline:auto;border-radius:18px;overflow:hidden;container-type:inline-size;
  background:linear-gradient(#8fd0e6 0%,#d8f0ef 70%)}
.scene.dusk{background:linear-gradient(#1d2459 0%,#6b4a8c 55%,#f29c7a 80%)}
.scene>*{position:absolute}
.sea{left:0;right:0;top:80%;bottom:0;background:linear-gradient(var(--sea),var(--sea-deep))}
.sea::before{content:"";position:absolute;left:0;right:0;top:12%;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 14px,transparent 14px 34px)}
.quay{left:0;right:0;top:72%;height:8%;background:#9aa3a6;box-shadow:inset 0 -3px 0 #7d8689}
.quay.wood{background:repeating-linear-gradient(90deg,#c99560 0 9%,#b07d4b 9% 9.6%);box-shadow:inset 0 -3px 0 var(--plank-dark)}
.roof{left:16%;width:68%;top:9%;height:16%;clip-path:polygon(50% 0,100% 100%,0 100%);background:#b4483a}
.bld{left:20%;width:60%;top:24.5%;height:47.5%;background:#eccba2}
.tint{filter:grayscale(var(--g,1)) brightness(var(--b,.85))}
.win{top:43%;width:14%;height:15%;background:#8fc8da;border:3px solid #fff;border-radius:3px}
.win.l{left:25%}.win.r{left:61%}
.win.dirty{background:repeating-linear-gradient(45deg,#7d6545 0 5px,#6a5236 5px 10px);border-color:#a89a88}
.door{left:44%;width:12%;top:47%;height:25%;background:#3f7f6a;border-radius:40% 40% 0 0 / 22% 22% 0 0;box-shadow:inset 0 0 0 3px #2c5d4d}
.door.boarded{background:#5b4b3a;box-shadow:none}
.door.boarded::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-18deg,#a0703e 0 7px,transparent 7px 15px)}
.sign{left:31%;width:38%;top:27%;height:8%;display:grid;place-items:center;background:var(--tile);border:2px solid var(--plank-dark);border-radius:6px;font-family:var(--f-title);font-size:4.2cqw;color:var(--sea-deep);white-space:nowrap}
.sign.broken{transform:rotate(-9deg);background:#d9d2c6;color:#8b8379;transform-origin:10% 50%}
.awning{left:21%;width:58%;top:36%;height:5.5%;background:repeating-linear-gradient(90deg,var(--coral) 0 8%,#fff 8% 16%);border-radius:0 0 10px 10px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.lights{left:3%;width:94%;top:6%;height:13%;border-bottom:3px dotted #ffd35a;border-radius:0 0 50% 50%;filter:drop-shadow(0 0 4px #ffd35a)}
.spot{transform:translate(-50%,-50%);font-size:calc(6.5cqw * var(--s,1));line-height:1}
.spot.ghosted{opacity:.3;filter:grayscale(1);animation:pulse 1.4s ease-in-out infinite}
.next{outline:2px dashed var(--coral);outline-offset:2px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{outline-color:transparent}}
.gull{left:62%;top:9%;font-size:4.2cqw;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-22cqw,3cqw)}}

.chap{background:var(--tile);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chap .ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);font-weight:600}
.chap h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:22px;line-height:1.15;text-wrap:balance}
.prog{height:8px;border-radius:4px;background:var(--tile-alt);overflow:hidden}
.prog i{display:block;height:100%;background:var(--coral)}
.task{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#fff}
.task .tn{flex:1;min-width:0;font-weight:500;font-size:14px}
.task.done{background:transparent;color:var(--muted)}
.task.done .tn{text-decoration:line-through}
.task.locked{opacity:.5;background:transparent}
.task .ck{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--tile-alt);color:var(--muted)}
.task.done .ck{background:var(--leaf);color:#fff}
.chap p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(6,25,33,.55)}
.sheet-card{position:relative;width:min(540px,100%);max-height:80%;overflow:auto;background:var(--tile);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:22px}
.x{width:34px;height:34px;border-radius:50%;background:var(--tile-alt);font-size:15px}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:#fff;margin-bottom:8px}
.row .ri{font-size:28px;width:40px;text-align:center;flex:none}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600;font-size:15px}
.row .rt small{color:var(--muted);font-size:12.5px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.slot{aspect-ratio:1;max-width:100%;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:30px;position:relative}
.slot.empty{background:var(--tile-alt)}
.slot .lv{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:700;color:var(--plank-dark)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:10px 0 0}

/* dialogue */
.dlg{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:linear-gradient(transparent 30%,rgba(6,25,33,.6));cursor:pointer;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px))}
.bub{position:relative;width:min(508px,100%);background:#fff;border-radius:20px;padding:44px 18px 14px;box-shadow:0 8px 0 rgba(0,0,0,.2);animation:in .25s ease-out}
.por{position:absolute;left:16px;top:-40px;width:76px;height:76px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:46px;border:4px solid var(--c,var(--coral))}
.who{position:absolute;left:100px;top:10px;padding:3px 12px;border-radius:12px;background:var(--c,var(--coral));color:#fff;font-weight:600;font-size:14px}
.say{margin:0;font-size:17px;line-height:1.45;min-height:3em}
.bub.narr{padding-top:16px;background:var(--sea-deep);color:var(--foam)}
.bub.narr .say{font-style:italic}
.bub.title{padding:26px 18px;text-align:center;background:var(--sea-deep);color:#fff}
.bub.title small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.bub.title h3{margin:6px 0 0;font-family:var(--f-title);font-weight:400;font-size:30px;text-wrap:balance}
.tapn{margin-top:8px;text-align:right;font-size:12px;color:var(--muted)}
.bub.narr .tapn,.bub.title .tapn{color:rgba(255,255,255,.6)}
.skip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:61;height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.85);font-size:13px;font-weight:600}

.toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;max-width:min(420px,calc(100% - 32px));background:var(--ink);color:#fff;padding:9px 14px;border-radius:14px;font-size:14px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:in .2s ease-out;pointer-events:none}
.loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--sea-deep);color:#fff;text-align:center}
.loading h1{font-family:var(--f-title);font-weight:400;font-size:40px;margin:0 0 6px}
.loading p{margin:0;opacity:.75}
/* sticker look: white outline + soft shadow on every item */
.cell .e,.rq,.shelf .big,.ghost,.slot,.row .ri,.pack .pi{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 3px 2px rgba(60,30,10,.35))}
.cell.web .e{filter:saturate(.5) drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.board{gap:3px;background:linear-gradient(#d39b5f,#b77d45)}
.cell{border-radius:10px!important;background:linear-gradient(#fffaf0,#f7ead0);box-shadow:inset 0 -3px 0 rgba(150,105,55,.18)}
.cell.alt{background:linear-gradient(#fdf1da,#f1dfbd)}
.cell.box{background:linear-gradient(#b57f4b,#946234)}
.cell.pop::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid #ffd85c;animation:ring .45s ease-out forwards;pointer-events:none}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.3);opacity:0}}
.btn,.go{background:linear-gradient(#3fb4cf,#1b7f9c);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #135a6f;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.go{background:linear-gradient(#5fd17f,#2f9a5e);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #1f6b40}
.btn.warn{background:linear-gradient(#ff8a9b,#ff4d6a);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #b8304a}
.btn.alt{background:linear-gradient(#fff,#f1e3c6);box-shadow:inset 0 2px 0 #fff,0 3px 0 #cdb58c;text-shadow:none}
.btn:disabled,.go:disabled{background:#ddd3c2;box-shadow:0 3px 0 #bfb3a0;text-shadow:none}
.btn:active:not(:disabled),.go:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.ord{position:relative;border-radius:16px;background:linear-gradient(#fff,#fff4df);overflow:visible}
.ord::after{content:"";position:absolute;left:18px;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:#fff}
.av{width:32px;height:32px;font-size:20px;background:radial-gradient(circle at 35% 30%,#fff,#ffd7a8);box-shadow:0 0 0 2px #fff,0 2px 3px rgba(0,0,0,.25)}
.por{background:radial-gradient(circle at 35% 30%,#fff 0%,#ffe2bd 60%,#f5c58e 100%);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.pill{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.pack{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 10px;border-radius:16px;text-align:center;color:#fff;
  background:linear-gradient(160deg,var(--p1),var(--p2));box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.2)}
.pack .pi{font-size:38px;line-height:1.1}
.pack b{font-size:15px}
.pack small{font-size:12px;opacity:.95;line-height:1.3;min-height:2.6em}
.pack s{font-size:12px;opacity:.75}
.pack .tag{position:absolute;top:-8px;right:-4px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;transform:rotate(6deg)}
.pack .btn{width:100%}
.cell .gz{position:absolute;right:1px;top:1px;width:calc(var(--t)*.34);height:calc(var(--t)*.34);border-radius:50%;display:grid;place-items:center;font-style:normal;
  font-size:calc(var(--t)*.22);background:linear-gradient(#ffe066,#f0a020);box-shadow:0 0 0 2px #fff,0 2px 2px rgba(0,0,0,.3);z-index:1}

// ---------- state ----------
let S = null, sel = -1, popAt = -1, view = 'board';
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const key = (c, l) => c + ':' + l;

function rndLow(chains){ const r = Math.random(); return { c: pick(chains), l: r < .55 ? 0 : r < .88 ? 1 : 2 }; }

function newGame(){
  const T = 'BBBBBBB' + 'BBWWWBB' + 'BW...WB' + 'W..K..W' + 'W.....W' + 'W.D...W' + 'BW...WB' + 'BBWWWBB' + 'BBBBBBB';
  const b = T.split('').map(ch => ch === 'B' ? { lock:2 } : ch === 'W' ? { ...rndLow(['bake','drink']), lock:1 }
    : ch === 'K' ? { g:'bake' } : ch === 'D' ? { g:'drink' } : null);
  b[4*7+3] = { c:'bake', l:0 };
  b[4*7+1] = { c:'drink', l:0 };
  const s = { v:1, board:b, energy:EMAX, eTick:Date.now(), coins:40, gems:5, stars:0, xp:0, level:1, orders:[], oid:0,
    inv:[], invSize:4, gens:['bake','drink'], chap:0, task:0, deco:[], introSeen:false, tut:0, savedAt:0, stats:{ merges:0, orders:0 } };
  const first = [[{c:'bake',l:1}],[{c:'drink',l:1}],[{c:'bake',l:2}]];
  first.forEach((reqs, k) => s.orders.push(mkOrder(s, reqs, [10, 6, 3][k])));
  return s;
}
function norm(s){
  const d = newGame();
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  if (!Array.isArray(s.board) || s.board.length !== N) s.board = d.board;
  return s;
}

// ---------- orders ----------
function reward(reqs){ let coins = 0, stars = 0; for (const r of reqs){ coins += Math.round(4 * Math.pow(1.9, r.l)); stars += r.l >= 3 ? 2 : 1; } return { coins, stars }; }
function mkOrder(s, reqs, cu){
  const used = s.orders.map(o => o.cu);
  if (cu === undefined){ do { cu = rnd(CUST.length); } while (used.includes(cu)); }
  return { id: ++s.oid, cu, reqs, ...reward(reqs) };
}
function randomOrder(){
  const chains = S.gens.map(g => GENS[g].c);
  const maxL = Math.min(5, 1 + Math.floor(S.level * .55));
  const two = S.level >= 3 && Math.random() < .4;
  const reqs = [];
  for (let k = 0; k < (two ? 2 : 1); k++){
    let l = Math.max(1, maxL - rnd(3));
    if (two) l = Math.max(1, l - 1);
    reqs.push({ c: pick(chains), l });
  }
  return mkOrder(S, reqs);
}
function boardCounts(){
  const m = {};
  S.board.forEach(it => { if (it && !it.lock && !it.g){ const k = key(it.c, it.l); m[k] = (m[k] || 0) + 1; } });
  return m;
}
function orderStatus(o, counts){
  const c = { ...counts };
  const have = o.reqs.map(r => { const k = key(r.c, r.l); if (c[k] > 0){ c[k]--; return true; } return false; });
  return { have, ready: have.every(Boolean) };
}
function deliver(k){
  const o = S.orders[k]; if (!o) return;
  if (!orderStatus(o, boardCounts()).ready) return;
  for (const r of o.reqs){
    let idx = -1;
    S.board.forEach((it, i) => { if (it && !it.lock && !it.g && it.c === r.c && it.l === r.l && (idx < 0 || idx === sel)) idx = i; });
    if (idx === sel) sel = -1;
    S.board[idx] = null;
  }
  ensureDaily();
  const coins = Math.round(o.coins * (bonus().id === 'coins2' ? 2 : 1) * (vipActive() ? 1.1 : 1)), pts = 2 + o.reqs.length;
  S.coins += coins; S.stats.coins += coins; S.stars += o.stars; S.stats.orders++;
  addXp(o.stars); addPts(pts);
  const card = Math.random() < .25; if (card) S.packs++;
  toast(`+${coins} 🪙  +${o.stars} ⭐  +${pts * (bonus().id === 'tok2' ? 2 : 1)} ${evSym()}${card ? '  +1 🃏' : ''}  Danke, ${CUST[o.cu][1]}!`);
  S.orders.splice(k, 1);
  S.orders.splice(k, 0, randomOrder());
  if (S.tut <= 2) S.tut = 3;
  save(); render();
}
function addXp(n){
  S.xp += n;
  let need;
  while (S.xp >= (need = xpNeed())){
    S.xp -= need; S.level++; S.gems += 2; S.energy += 20;
    setTimeout(() => toast(`Level ${S.level}! +2 💎  +20 ⚡`), 900);
  }
}
const xpNeed = () => 3 + S.level * 2;

// ---------- energy ----------
function regen(){
  const now = Date.now();
  if (S.energy >= EMAX){ S.eTick = now; return; }
  const n = Math.floor((now - S.eTick) / REGEN);
  if (n > 0){ S.energy = Math.min(EMAX, S.energy + n); S.eTick += n * REGEN; if (S.energy >= EMAX) S.eTick = now; }
}
function spendEnergy(){ if (S.energy >= EMAX) S.eTick = Date.now(); S.energy--; }

// ---------- board logic ----------
// painted artwork: build.js fills ART with the files found in img/; anything missing falls back to the emoji
const ART = new Set(/*ARTLIST*/[]);
const ic = (key, e, cls) => ART.has(key) ? `<img class="art${cls ? ' ' + cls : ''}" src="img/${key}.png" alt="" draggable="false">` : e;
function info(it){
  if (it.g) return { e: GENS[it.g].e, h: ic('gen_' + it.g, GENS[it.g].e), n: GENS[it.g].n };
  const ch = CH[it.c]; return { e: ch.it[it.l][0], h: ic(it.c + '_' + it.l, ch.it[it.l][0]), n: ch.it[it.l][1], max: ch.it.length - 1, ch };
}
function nearFree(i){
  const r0 = Math.floor(i / COLS), c0 = i % COLS; let best = -1, bd = 1e9;
  S.board.forEach((it, j) => { if (it === null){ const r = Math.floor(j / COLS), c = j % COLS; const d = (r - r0) ** 2 + (c - c0) ** 2 + Math.random() * .1; if (d < bd){ bd = d; best = j; } } });
  return best;
}
function produce(i){
  const g = GENS[S.board[i].g];
  if (S.energy <= 0){ toast('Keine Energie mehr. Warte kurz oder hol dir welche im Laden.'); openShop(); return; }
  const j = nearFree(i);
  if (j < 0){ toast('Das Brett ist voll. Verbinde, liefere oder lagere Teile ein.'); return; }
  ensureDaily();
  const bid = bonus().id;
  if (bid !== 'esave' || Math.random() < .5) spendEnergy();
  const r = Math.random();
  S.board[j] = r < .04 ? { c:'coin', l:0 } : { c: g.c, l: r < (bid === 'luck' ? .4 : .19) ? 1 : 0 };
  S.stats.made++;
  popAt = j;
  if (S.tut === 0) S.tut = 1;
  save(); render();
}
function revealAround(i){
  const r = Math.floor(i / COLS), c = i % COLS;
  const chains = S.gens.map(g => GENS[g].c);
  [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr, cc]) => {
    if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) return;
    const j = rr * COLS + cc, it = S.board[j];
    if (it && it.lock === 2) S.board[j] = { ...rndLow(chains), lock:1 };
  });
}
function canMerge(a, b){ return a && b && !a.g && !b.g && b.lock !== 2 && b.lock !== 3 && a.c === b.c && a.l === b.l && a.l < CH[a.c].it.length - 1; }
function tryMove(a, b){
  if (a === b){ render(); return; }
  const A = S.board[a], B = S.board[b];
  if (!A || A.lock){ render(); return; }
  if (canMerge(A, B)){
    const nl = A.l + 1;
    S.board[b] = { c: A.c, l: nl }; S.board[a] = null;
    S.stats.merges++; revealAround(b); sel = b; popAt = b;
    if (nl >= 2 && A.c !== 'coin' && A.c !== 'energy'){
      const r = Math.random();
      if (r < .14){ const j = nearFree(b); if (j >= 0) S.board[j] = { c: r < .06 ? 'energy' : 'coin', l:0 }; }
      else if (r < .19){ const j = nearFree(b); if (j >= 0){ S.board[j] = { c: A.c, l: nl, lock:3, exp: Date.now() + 90000 }; toast('Eine Blase ist aufgetaucht! 🫧'); } }
      ensureDaily(); if (nl >= 2 && Math.random() < .25) addPts(1);
    }
    if (S.tut === 1) S.tut = 2;
  } else if (B === null){
    S.board[b] = A; S.board[a] = null; sel = b;
  } else if (B.lock){
    render(); return;
  } else {
    S.board[b] = A; S.board[a] = B; sel = b;
  }
  save(); render();
}
function collect(i){
  const it = S.board[i], v = CH[it.c].val[it.l];
  if (it.c === 'coin'){ S.coins += v; S.stats.coins += v; toast(`+${v} 🪙`); } else { S.energy += v; toast(`+${v} ⚡`); }
  S.board[i] = null; if (sel === i) sel = -1;
  save(); render();
}
function tap(i){
  const it = S.board[i];
  if (!it || it.lock){ sel = it ? i : -1; render(); return; }
  if (it.g){ sel = i; produce(i); return; }
  if (it.c === 'coin' || it.c === 'energy'){ collect(i); return; }
  sel = sel === i ? -1 : i; render();
}
function sell(i){
  const it = S.board[i]; if (!it || it.g || it.lock) return;
  S.coins += it.l + 1; S.board[i] = null; sel = -1;
  toast(`Verkauft: +${it.l + 1} 🪙`); save(); render();
}
function store(i){
  const it = S.board[i]; if (!it || it.lock) return;
  if (S.inv.length >= S.invSize){ toast('Das Lager ist voll. Mehr Platz gibt es im Laden.'); render(); return; }
  S.inv.push(it); S.board[i] = null; sel = -1;
  toast('Ins Lager gelegt 📦'); save(); render();
}
function unstore(k){
  const j = nearFree(24 + 7);
  if (j < 0){ toast('Kein freies Feld auf dem Brett.'); return; }
  S.board[j] = S.inv.splice(k, 1)[0]; popAt = j; sel = j;
  save(); render(); openInv();
}
function giveGen(g){
  if (!S.gens.includes(g)) S.gens.push(g);
  const j = nearFree(31);
  if (j >= 0){ S.board[j] = { g }; popAt = j; } else { S.inv.push({ g }); toast(`${GENS[g].n} liegt im Lager.`); }
}

// ---------- story ----------
function doTask(){
  const ch = CHAPTERS[S.chap]; if (!ch) return;
  const t = ch.tasks[S.task];
  if (S.stars < t.cost){ toast(`Dir fehlen noch ${t.cost - S.stars} ⭐. Erfülle Bestellungen!`); return; }
  S.stars -= t.cost; S.deco.push(t.d); S.task++;
  if (t.gen) giveGen(t.gen);
  let lines = [...t.s];
  if (S.task >= ch.tasks.length){
    S.gems += ch.gems; S.chap++; S.task = 0;
    mail('paul', `Glückwunsch zu Kapitel ${S.chap}! Ganz Möwenhafen ist stolz auf dich.`, { packs:2, coins:200 });
    lines = lines.concat(ch.outro);
    const nx = CHAPTERS[S.chap];
    if (nx) lines = lines.concat([['title', `Kapitel ${S.chap + 1}`, nx.t]], nx.intro || []);
  }
  if (S.tut < 4) S.tut = 4;
  save(); render();
  playScene(lines);
}

function fmtT(ms){ const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function renderBoard(){
  const need = new Set(); S.orders.forEach(o => o.reqs.forEach(r => need.add(key(r.c, r.l))));

    const it = S.board[i], r = Math.floor(i / COLS), c = i % COLS;

        if (it.lock === 3) cls += ' bub';
        inner = `<span class="e">${f.h}</span>${gz}`;
        if (!it.g && it.c !== 'coin' && it.c !== 'energy') inner += `<b class="lv">${it.l === f.max ? '★' : it.l + 1}</b>`;
        if (!it.g && !it.lock && need.has(key(it.c, it.l))) inner += '<i class="ok">✓</i>';

    if (i === sel) cls += ' sel';

function evAction(k){
  ensureDaily();

    const yest = dayKey(Date.now() - DAY);
    S.login.streak = S.login.last === yest ? S.login.streak + 1 : 1; S.login.last = dayKey();
    const g = LOGIN[(S.login.streak - 1) % 7]; give(g); toast(`Tag ${(S.login.streak - 1) % 7 + 1}: ${packText(g)}`);
  }

  if (k === 'chest' && !S.daily.chest && S.daily.claimed.every(Boolean)){ S.daily.chest = 1; give({ gems:5, energy:50, packs:1 }); toast('Truhe geöffnet: 5 💎 · 50 ⚡ · 1 🃏'); }

  if (k === 'back'){ openEvents(); return; }
  if (k === 'pack'){ openPack(); return; }

    if (S.ev.open.includes(i)) return;
    S.ev.pts--; S.ev.open.push(i);

    if (c === 'c'){ give({ coins:10 }); toast('+10 🪙'); }
    if (c === 'e'){ give({ energy:5 }); toast('+5 ⚡'); }
    if (c === 't'){
      S.ev.found++; give({ coins:60 });
      if (S.ev.found >= 3){ give({ gems:10, packs:2 }); toast(`Alle Schätze gefunden! 10 💎 · 2 🃏. Weiter zu Strand ${S.ev.lvl + 2}!`); S.ev.lvl++; S.ev.open = []; S.ev.found = 0; }
      else toast(`Schatztruhe! +60 🪙 (${S.ev.found}/3)`);
    }
  }
  if (k === 'spin' && spinReady()){
    const w = rnd(WHEEL.length), a = w * 45 + 22.5;
    wheelRot += 1800 + ((360 - a) - (wheelRot % 360) + 720) % 360;

    setTimeout(() => { toast('Glücksrad: ' + packText(WHEEL[w])); render(); if (!$('sheet').hidden) openEvents(); }, 2700);
    return;
  }
  save(); render(); openEvents();
}

const cloud = { ref:null, writing:false, dirty:false, t:null, status:'local' };
function syncText(){ return cloud.status === 'cloud' ? 'In deinem Konto gespeichert, auf Handy und PC gleich.' : cloud.status === 'err' ? 'Cloud-Speichern gerade nicht möglich, lokal gesichert.' : 'Nur in diesem Browser gespeichert.'; }
function loadLocal(){ try { const t = localStorage.getItem(LS); return t ? JSON.parse(t) : null; } catch (_) { return null; } }
function save(){
  S.savedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (_) {}
  if (cloud.ref){ clearTimeout(cloud.t); cloud.t = setTimeout(flush, 1500); }
}
async function flush(){
  if (!cloud.ref) return;
  if (cloud.writing){ cloud.dirty = true; return; }
  cloud.writing = true;
  try { await cloud.ref.set({ s: JSON.stringify(S), savedAt: S.savedAt }); cloud.status = 'cloud'; }
  catch (_) { cloud.status = 'err'; }
  cloud.writing = false;
  const st = $('syncTxt'); if (st) st.textContent = syncText();
  if (cloud.dirty){ cloud.dirty = false; flush(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && S && cloud.ref){ clearTimeout(cloud.t); flush(); } });
async function initCloud(){
  try {
    if (!window.claude || !window.claude.use) return null;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return null;
    const id = await user.id(); if (!id) return null;
    const ref = db.doc('data/users/' + id + '/save');
    const snap = await ref.get();
    cloud.ref = ref; cloud.status = 'cloud';
    return snap.exists ? snap.data() : {};
  } catch (_) { return null; }
}
const parse = d => { try { return d && d.s ? JSON.parse(d.s) : null; } catch (_) { return null; } };
const newest = (...xs) => xs.filter(Boolean).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0))[0] || null;

// ---------- boot ----------
function begin(){
  if (ART.has('bg_harbor')) document.body.classList.add('bgart');
  S = norm(S); regen();
  S.stats = { merges:0, orders:0, made:0, coins:0, ...S.stats };
  ensureDaily();
  $('loading').hidden = true;
  setView('board');
  const gift = () => { if (loginReady()) setTimeout(openEvents, 500); };
  if (!S.introSeen) playScene(INTRO, () => { S.introSeen = true; save(); render(); gift(); }); else gift();
  let lastDay = dayKey();
  setInterval(() => {
    const e = S.energy; regen(); if (e !== S.energy) save();
    renderTop(); tickCd(); tickShelf(); tickBubbles();
    if (dayKey() !== lastDay){ lastDay = dayKey(); ensureDaily(); render(); }
  }, 1000);
}
function start(hot){
  window.claude?.hot?.snapshot?.(() => ({ state: S }));
  if (hot && hot.state){ S = hot.state; begin(); initCloud(); return; }
  const local = loadLocal();
  const cp = initCloud();
  Promise.race([cp, new Promise(r => setTimeout(() => r('timeout'), 6000))]).then(res => {
    S = newest(local, res && res !== 'timeout' ? parse(res) : null) || newGame();
    begin();
    if (res === 'timeout') cp.then(r => { const c = parse(r); if (c && c.savedAt > (S.savedAt || 0)){ S = norm(c); render(); } if (cloud.ref) save(); });
    else if (cloud.ref && S.savedAt) save();
  });
}
const hot = window.claude?.hot;
if (hot && hot.ready) hot.ready(start); else start(hot?.data ?? {});
})();
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
